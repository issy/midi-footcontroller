[package]
name = "foundation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "foundation"
path = "src/lib.rs"

[dependencies]
embedded-graphics = { version = "0.8.2" }
prost = { version = "0.14.3", default-features = false, features = ["derive"] }
heapless = { version = "0.9.2" }
embassy-sync = { version = "0.7.2", features = [] }
