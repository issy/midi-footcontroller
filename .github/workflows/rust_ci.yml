name: CI (Firmware)

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "firmware/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: "firmware"
            target: riscv32imac-unknown-none-elf
          - name: "simulator"
            target: wasm32-unknown-unknown
          - name: "foundation"
            target: riscv32imac-unknown-none-elf
          - name: "foundation"
            target: wasm32-unknown-unknown
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --all-features --workspace -- -D warnings
    defaults:
      run:
        working-directory: "firmware/${{ matrix.project.name }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          targets: "${{ matrix.project.target }}"
          toolchain: "1.94.0"
          components: rust-src, rustfmt, clippy

      - name: Enable caching
        uses: Swatinem/rust-cache@v2

      - name: Run command
        run: cargo --target ${{ matrix.project.target }} ${{ matrix.action.command }} ${{ matrix.action.args }}
