[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[[bin]]
name = "firmware"
test = false

[dependencies]
foundation = { path = "../foundation" }

esp-hal = { version = "~1.0", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
esp-alloc = { version = "0.9.0", features = ["esp32c6"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6", "log-04"] }

embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-embedded-hal = { version = "0.5.0" }
embassy-sync = { workspace = true, features = ["log"] }

log = { workspace = true }
heapless = { workspace = true }

embedded-graphics = { workspace = true }
mipidsi = { version = "0.8", features = ["batch", "heapless"] }
display-interface-spi = { version = "0.5.0" }

critical-section = "1.2.0"
static_cell = { workspace = true }
