[package]
edition = "2024"
name = "midi-controller"
rust-version = "1.88"
version = "0.1.0"

[workspace]
members = ["firmware", "foundation"]

[lib]
test = false

[[bin]]
name = "firmware"
path = "firmware/src/bin/main.rs"
test = false

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
