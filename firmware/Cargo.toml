[package]
edition = "2024"
name = "firmware"
rust-version = "1.88"
version = "0.1.0"

[lib]
test = false

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"
test = false

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6", "log-04"] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6", "log-04"] }
log = "0.4.27"

embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-embedded-hal = { version = "0.5.0" }
embassy-sync = { version = "0.7.2", features = ["log"] }
esp-backtrace = { version = "0.18.1", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
esp-alloc = { version = "0.9.0", features = ["esp32c6"] }

embedded-graphics = { version = "0.8.2" }
mipidsi = { version = "0.8", features = ["batch", "heapless"] }
display-interface-spi = { version = "0.5.0" }

critical-section = "1.2.0"
static_cell = "2.1.1"

prost = { version = "0.14.3", default-features = false, features = ["derive"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
